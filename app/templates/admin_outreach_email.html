<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email Draft | Farmsource</title>
    <style>
      body {
        color: #17221c;
        font-family: Arial, sans-serif;
        line-height: 1.5;
        margin: 0;
        padding: 32px;
      }
      main {
        max-width: 820px;
      }
      pre {
        background: #f7faf8;
        border: 1px solid #d8e3dc;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        padding: 18px;
        white-space: pre-wrap;
      }
      button,
      a {
        background: #2f6f4e;
        border: 0;
        border-radius: 7px;
        color: #fff;
        cursor: pointer;
        display: inline-block;
        font: inherit;
        margin-right: 8px;
        padding: 10px 14px;
        text-decoration: none;
      }
      .secondary {
        background: #eef4f0;
        color: #17221c;
      }
      .hint {
        color: #4d5c54;
        margin-top: 18px;
      }
      input {
        border: 1px solid #d8e3dc;
        border-radius: 7px;
        box-sizing: border-box;
        font: inherit;
        margin-bottom: 16px;
        padding: 10px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <p>To: {{ candidate.contact_email }}</p>
      <label>Subject</label>
      <input id="email-subject" value="{{ email.subject }}">
      <label>Email draft</label>
      <pre id="email-body">{{ email.body }}</pre>
      <a href="{{ email.gmail_compose }}" target="_blank" rel="noopener">Open in Gmail</a>
      <button type="button" onclick="copyDraft()">Copy email</button>
      <a href="{{ email.mailto }}">Open email app</a>
      <a class="secondary" href="/admin/outreach">Back to outreach</a>
      <p class="hint">To save it as a Gmail draft, open it in Gmail, review the message, then close the compose window without sending.</p>
    </main>
    <script>
      async function copyDraft() {
        const subject = document.getElementById("email-subject").value;
        const body = document.getElementById("email-body").innerText;
        await navigator.clipboard.writeText(`Subject: ${subject}\n\n${body}`);
      }
    </script>
  </body>
</html>
