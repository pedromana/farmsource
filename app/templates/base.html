<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6f4e">
    <title>{% block title %}Farmsource{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Farmsource</a>
      <nav aria-label="Primary navigation">
        <a href="/customer">Customer</a>
        <a href="/customer/catalog">Catalog</a>
        <a class="cart-icon-link" href="/customer/cart" aria-label="Cart">
          <span class="cart-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M7 7h13l-1.4 7H8.2L7 7Z"></path>
              <path d="M5 4h2l1.2 10.3a2 2 0 0 0 2 1.7H18"></path>
              <circle cx="10" cy="20" r="1.5"></circle>
              <circle cx="17" cy="20" r="1.5"></circle>
            </svg>
          </span>
          <span class="cart-count" data-cart-count {% if not cart_count | default(0) %}hidden{% endif %}>{{ cart_count | default(0) }}</span>
        </a>
        <a href="/admin">Admin</a>
        <a href="/admin/sources">Sources</a>
        <a href="/admin/producers">Producers</a>
        <a href="/admin/products">Products</a>
        <a href="/driver">Driver</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js" defer></script>
    <dialog class="cart-ready-dialog" data-cart-dialog>
      <form method="dialog">
        <p class="eyebrow">Cart ready</p>
        <h2>Item added to your cart.</h2>
        <p>Your cart is ready for checkout, or you can keep shopping the weekly catalog.</p>
        <div class="actions">
          <button value="close" type="submit">Keep shopping</button>
          <a class="button primary" href="/customer/checkout">Checkout</a>
        </div>
      </form>
    </dialog>
  </body>
</html>
