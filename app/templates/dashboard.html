<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FarmSource</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>FarmSource</h1>
        <p>Qualified producers with validated online ordering signals.</p>
      </div>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/admin">Sources</a>
      </nav>
    </header>

    <main>
      <section class="filters">
        <input id="search" placeholder="Search farm name">
        <input id="city" placeholder="City">
        <input id="county" placeholder="County">
        <input id="state" placeholder="State">
        <input id="products" placeholder="Products">
        <input id="platform" placeholder="Platform">
        <input id="source" placeholder="Source">
        <select id="destination_type">
          <option value="">All ordering types</option>
          <option value="ecommerce_store">Ecommerce store</option>
          <option value="csa_signup">CSA signup</option>
          <option value="subscription_box">Subscription box</option>
          <option value="farm_platform_store">Farm platform store</option>
        </select>
        <label><input type="checkbox" id="delivery"> Delivery</label>
        <label><input type="checkbox" id="pickup"> Pickup</label>
        <button id="apply">Apply</button>
        <a id="export" class="button" href="/export">Export XLSX</a>
      </section>

      <section class="table-shell">
        <div class="table-header">
          <strong id="result-count">Loading...</strong>
          <span id="status"></span>
        </div>
        <div class="responsive-table">
          <table>
            <thead>
              <tr>
                <th>Producer</th>
                <th>Region</th>
                <th>Products</th>
                <th>Type</th>
                <th>Platform</th>
                <th>Score</th>
                <th>Links</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="prev">Previous</button>
          <span id="page-label">Page 1</span>
          <button id="next">Next</button>
        </div>
      </section>
    </main>
    <script src="/static/dashboard.js"></script>
  </body>
</html>
